<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1880" viewBox="0 0 640 1880" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">从接口复用到 · 可切换的采购选项</title><desc id="desc">原创分析示意，非测量数据。可复用的 Python、API 和开放实现可减少部分适配与知识重学成本。候选平台仍需通过数值与模型质量、真实预填充和解码及缓存调度的服务目标、故障恢复与升级回归三层验收。模型或编译器升级需要重新验收。再在同一负载和规划期内核算迁移固定成本与运行成本；若验收、成本与风险均可接受，才形成可实际切换的采购选项，并可能增强议价与交付竞争。开放许可、单算子跑分、商业支持可获得性分别核查。图不保证降价或迁移回本。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}</style>
<rect width="640" height="1880" fill="#F7F8FA"/>
<text x="32" y="48" font-size="34" class="heading" text-anchor="start">从接口复用到</text>
<text x="32" y="88" font-size="34" class="heading" text-anchor="start">可切换的采购选项</text>
<text x="32" y="132" font-size="26" class="secondary" text-anchor="start">软件可移植性如何转化为商业选择</text>
<rect x="40" y="162" width="560" height="122" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="206" font-size="30" class="heading" text-anchor="middle">复用 Python / API 与开放源码</text>
<text x="320" y="249" font-size="27" class="secondary" text-anchor="middle">统一接口只覆盖迁移的一部分</text>
<path d="M320 291 V319" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="330" width="560" height="122" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="375" font-size="29" class="heading" text-anchor="middle">减少部分适配与知识重学</text>
<text x="320" y="418" font-size="26" class="secondary" text-anchor="middle">能复用的部分，才构成成本节省</text>
<path d="M320 460 V485" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="496" width="560" height="568" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="539" font-size="30" class="heading accent" text-anchor="middle">三层验收：仍须逐项通过</text>
<rect x="60" y="566" width="520" height="110" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="608" font-size="28" class="heading" text-anchor="middle">01  数值与模型质量</text>
<text x="320" y="649" font-size="26" class="secondary" text-anchor="middle">精度、量化与任务效果</text>
<rect x="60" y="694" width="520" height="150" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="736" font-size="29" class="heading" text-anchor="middle">02  真实推理服务</text>
<text x="320" y="777" font-size="26" class="secondary" text-anchor="middle">预填充 / 解码 / 缓存 / 调度</text>
<text x="320" y="818" font-size="26" class="secondary" text-anchor="middle">按实际负载核查延迟与错误预算</text>
<rect x="60" y="862" width="520" height="110" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="904" font-size="28" class="heading" text-anchor="middle">03  故障恢复与升级回归</text>
<text x="320" y="947" font-size="26" class="secondary" text-anchor="middle">恢复、回滚与版本兼容</text>
<text x="320" y="1014" font-size="26" class="secondary" text-anchor="middle">模型 / 编译器升级</text>
<text x="320" y="1050" font-size="26" class="heading accent" text-anchor="middle">重新验收</text>
<path d="M572 1023 H617 V540 H589" fill="none" stroke="#355C7D" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path d="M320 1072 V1097" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="1108" width="560" height="158" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1151" font-size="28" class="heading" text-anchor="middle">核算迁移与运行成本</text>
<text x="320" y="1194" font-size="26" class="secondary" text-anchor="middle">同一负载、同一规划期</text>
<text x="320" y="1237" font-size="27" class="secondary" text-anchor="middle">固定迁移投入 + 持续运行费用</text>
<path d="M320 1274 V1301" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="1312" width="560" height="122" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1357" font-size="28" class="heading" text-anchor="middle">成为可实际切换的采购选项</text>
<text x="320" y="1400" font-size="27" class="secondary" text-anchor="middle">验收通过，且成本与风险可接受</text>
<path d="M320 1442 V1469" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="1480" width="560" height="122" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1525" font-size="30" class="heading accent" text-anchor="middle">可能增强议价能力</text>
<text x="320" y="1568" font-size="27" class="secondary" text-anchor="middle">可能改善供给与交付竞争</text>
<rect x="40" y="1638" width="560" height="158" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="1682" font-size="28" class="heading" text-anchor="middle">三件事分别核查</text>
<text x="320" y="1725" font-size="26" class="secondary" text-anchor="middle">开放许可 · 单算子跑分</text>
<text x="320" y="1766" font-size="26" class="secondary" text-anchor="middle">商业支持是否实际可获得</text>
<text x="320" y="1830" font-size="24" class="muted" text-anchor="middle">箭头表示条件性路径，不保证降价或回本</text>
<text x="320" y="1865" font-size="25" class="muted" text-anchor="middle">原创分析示意 · 非测量数据</text>
</svg>
