<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1960" viewBox="0 0 640 1960" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">分块处理 · 保留整行的 softmax</title><desc id="desc">原创前向机制示意，非性能测量。对一个查询行，将合法键分成两个不相交块；每块保留最大分数 m、相对该最大值计算的指数权重和 l，以及相同未归一化权重下的值向量加权和 u。块 A 和 B 各有自己的三项状态。合并时选择两个块最大值中较大者作为共享的新最大值，再由各块旧最大值与新最大值之差计算指数缩放系数。同一块的 l 和 u 使用相同系数缩放，分别相加得到合并状态，最后将合并 u 除以合并 l。不能直接相加两块已归一化的输出。无合法键的空块跳过；若整行都没有合法键，输出需由实现单独约定。完整注意力仍计算所有合法 query-key 配对，分块省去完整二次规模分数或概率中间矩阵的 HBM 读写，不减少 dense attention 的合法配对数量。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}.state{font-family:Consolas,Menlo,monospace;fill:#355C7D}</style>
<rect width="640" height="1960" fill="#F7F8FA"/>
<text x="32" y="48" font-size="34" class="heading" text-anchor="start">分块处理</text>
<text x="32" y="88" font-size="34" class="heading" text-anchor="start">保留整行的 softmax</text>
<text x="32" y="132" font-size="25" class="secondary" text-anchor="start">一个查询行：合法键分为两个不相交块</text>
<rect x="40" y="166" width="560" height="156" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="212" font-size="30" class="heading" text-anchor="middle">每块保留三项状态</text>
<text x="320" y="258" font-size="26" class="secondary" text-anchor="middle">最大分数 m · 移位后指数和 l</text>
<text x="320" y="300" font-size="26" class="secondary" text-anchor="middle">未归一化的值向量加权和 u</text>
<path d="M320 330 V357 H28 V568" fill="none" stroke="#355C7D" stroke-width="2.5"/>
<rect x="68" y="390" width="508" height="110" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="434" font-size="29" class="heading" text-anchor="middle">块 A 的状态</text>
<text x="320" y="477" font-size="29" class="state" text-anchor="middle">m_A · l_A · u_A</text>
<rect x="68" y="536" width="508" height="110" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="580" font-size="29" class="heading" text-anchor="middle">块 B 的状态</text>
<text x="320" y="623" font-size="29" class="state" text-anchor="middle">m_B · l_B · u_B</text>
<path d="M28 446 H59" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M28 568 H59" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M584 446 H612 V692 H320 V721" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M584 591 H612" fill="none" stroke="#355C7D" stroke-width="2.5"/>
<rect x="40" y="732" width="560" height="122" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="777" font-size="28" class="heading accent" text-anchor="middle">选择共享的新最大值 m</text>
<text x="320" y="820" font-size="27" class="secondary" text-anchor="middle">取两块最大分数中较大者</text>
<path d="M320 862 V890" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="902" width="560" height="206" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="948" font-size="30" class="heading accent" text-anchor="middle">重标定，再分别合并</text>
<text x="320" y="991" font-size="26" class="secondary" text-anchor="middle">对旧最大值减新最大值取指数</text>
<text x="320" y="1033" font-size="26" class="secondary" text-anchor="middle">同块的 l 与 u 使用同一系数</text>
<text x="320" y="1076" font-size="26" class="secondary" text-anchor="middle">分别相加，得到合并的 l 与 u</text>
<path d="M320 1116 V1144" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="1156" width="560" height="118" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1200" font-size="30" class="heading" text-anchor="middle">最后再归一化</text>
<text x="320" y="1244" font-size="26" class="secondary" text-anchor="middle">合并的 u 除以合并的 l，得到输出</text>
<rect x="40" y="1316" width="560" height="108" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="1360" font-size="29" class="heading" text-anchor="middle">不能直接相加</text>
<text x="320" y="1402" font-size="26" class="secondary" text-anchor="middle">两块各自归一化后的输出</text>
<rect x="40" y="1462" width="560" height="150" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="1506" font-size="29" class="heading" text-anchor="middle">空状态需显式处理</text>
<text x="320" y="1549" font-size="27" class="secondary" text-anchor="middle">无合法键的块：跳过</text>
<text x="320" y="1590" font-size="26" class="secondary" text-anchor="middle">整行无合法键：由实现单独约定</text>
<rect x="40" y="1652" width="560" height="210" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1697" font-size="30" class="heading accent" text-anchor="middle">改变的是数据搬运</text>
<text x="320" y="1740" font-size="26" class="secondary" text-anchor="middle">完整注意力仍覆盖所有合法配对</text>
<text x="320" y="1783" font-size="26" class="secondary" text-anchor="middle">避免完整二次规模中间矩阵落入 HBM</text>
<text x="320" y="1825" font-size="26" class="secondary" text-anchor="middle">不减少 dense attention 的合法配对数</text>
<text x="320" y="1906" font-size="24" class="muted" text-anchor="middle">单行、两块的前向机制示意</text>
<text x="320" y="1942" font-size="25" class="muted" text-anchor="middle">原创图解 · 非性能测量</text>
</svg>
