<text x="320" y="1229" font-size="28" class="" text-anchor="middle">Keep valid KV; discard unaccepted tail</text>
<text x="320" y="1264" font-size="28" class="" text-anchor="middle">Cache the new sampled token</text>
<text x="320" y="1297" font-size="28" class="" text-anchor="middle">on the next forward pass</text>
<rect x="24" y="1336" width="592" height="156" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1379" font-size="28" class="heading" text-anchor="middle">Correction preserves target sampling</text>
<text x="320" y="1426" font-size="28" class="secondary" text-anchor="middle">Speed depends on draft, verify,</text>
<text x="320" y="1461" font-size="28" class="secondary" text-anchor="middle">and cache costs</text>
<text x="320" y="1540" font-size="24" class="muted" text-anchor="middle">Original mechanism · Not benchmark data</text>
