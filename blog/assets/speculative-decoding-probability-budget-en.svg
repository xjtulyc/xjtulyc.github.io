<rect x="40" y="348" width="560" height="110" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="383" font-size="30" class="heading" text-anchor="middle">One causal target-model pass</text>
<text x="320" y="418" font-size="28" class="" text-anchor="middle">Distributions for candidates</text>
<text x="320" y="448" font-size="28" class="" text-anchor="middle">and the next token</text>
<path d="M320 463 V479" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="486" width="560" height="132" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="525" font-size="30" class="heading accent" text-anchor="middle">Accept probabilistically</text>
<text x="320" y="565" font-size="28" class="" text-anchor="middle">Keep the consecutive</text>
<text x="320" y="599" font-size="28" class="" text-anchor="middle">accepted prefix</text>
<path d="M320 623 V638 H34 V872" fill="none" stroke="#355C7D" stroke-width="2.5"/>
<path d="M34 718 H67" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M34 872 H67" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="74" y="656" width="490" height="124" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="319" y="694" font-size="30" class="heading" text-anchor="middle">First rejection</text>
<text x="319" y="732" font-size="28" class="" text-anchor="middle">Sample the normalized</text>
<text x="319" y="765" font-size="28" class="" text-anchor="middle">positive residual</text>
<rect x="74" y="810" width="490" height="124" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="319" y="848" font-size="30" class="heading" text-anchor="middle">All accepted</text>
<text x="319" y="885" font-size="28" class="" text-anchor="middle">Sample the last target distribution</text>
<text x="319" y="919" font-size="28" class="" text-anchor="middle">for a bonus token</text>
<path d="M569 718 H606 V956 H320 V974" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M569 872 H606" fill="none" stroke="#355C7D" stroke-width="2.5"/>
