<text x="320" y="1021" font-size="30" class="heading" text-anchor="middle">Emit accepted prefix</text>
<text x="320" y="1058" font-size="30" class="heading" text-anchor="middle">and one new token</text>
<text x="320" y="1094" font-size="26" class="secondary" text-anchor="middle">Before EOS or length limits</text>
