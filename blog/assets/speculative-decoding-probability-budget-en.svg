<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1570" viewBox="0 0 640 1570" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Speculative decoding: one round</title><desc id="desc">A conceptual round of speculative decoding. Starting from the committed prefix, a draft model sequentially samples a block of candidates. One causal target-model pass evaluates distributions for the candidates and next token. Accept candidates probabilistically and keep only the consecutive accepted prefix. The mutually exclusive branches are sampling a normalized positive residual at the first rejection, or, if all candidates are accepted, sampling a bonus token from the last target distribution. Before EOS or length limits, either branch emits the accepted prefix and one new token for the round. Retain valid target-model KV and discard unaccepted draft positions. Cache the new sampled token on the next forward pass. Sampling correction preserves the target distribution; speed also depends on draft, verification, and cache costs. This is not benchmark data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}</style>
<rect width="640" height="1570" fill="#F7F8FA"/>
