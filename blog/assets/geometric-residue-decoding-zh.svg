<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2450" viewBox="0 0 640 2450" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">几何中的离散身份</title><desc id="desc">原创 atom14 机制示意，不是真实分子坐标或实验数据，箭头表示信息流。固定表示有 14 个槽位：前 4 槽是主链 N、CA、C、O，后 10 槽容纳侧链重原子和虚拟标记。Thr 的槽 1–7 分别是 N、CA、C、O、CB、OG1、CG2；槽 8–10 为 N 处标记，槽 11–14 为 O 处标记。7 个标记不是物理原子。固定版本解码器为每个后 10 槽寻找最近的主链锚点，仅在距离不大于 0.5 Å 时计数；按 N、CA、C、O 排序的计数 (3,0,0,4) 查表得到 Thr，未匹配编码的计数得到 UNK。假设最近锚点为 N，0.49 Å 会计入 N，0.51 Å 不计数；这些示例值说明小几何扰动可能跨越离散边界，并非实测。连续噪声经去噪得到几何，再解码残基身份；Thr 模板保留前 7 槽并删除后 7 个标记槽，仍须独立化学结构验证。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}.slot{font-family:Arial,"PingFang SC",sans-serif;font-weight:700}</style>
<rect width="640" height="2450" fill="#F7F8FA"/>
<text x="32" y="62" font-size="36" class="heading" text-anchor="start">几何中的离散身份</text>
<text x="32" y="112" font-size="26" class="secondary" text-anchor="start">BoltzGen atom14 · 固定版本的解码机制</text>
<rect x="24" y="160" width="592" height="320" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="204" font-size="30" class="heading" text-anchor="middle">01 · 固定长度：14 个槽位</text>
<text x="320" y="249" font-size="27" class="secondary" text-anchor="middle">槽 1–4：主链锚点 N / CA / C / O</text>
<text x="320" y="287" font-size="27" class="secondary" text-anchor="middle">槽 5–14：侧链重原子与虚拟标记</text>
<rect x="46" y="312" width="68" height="56" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
