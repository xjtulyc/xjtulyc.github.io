<text x="314" y="649" font-size="24" class="muted" text-anchor="middle">4</text>
<text x="314" y="694" font-size="27" class="slot" text-anchor="middle">O</text>
<rect x="358" y="622" width="68" height="94" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="392" y="649" font-size="24" class="muted" text-anchor="middle">5</text>
<text x="392" y="694" font-size="27" class="slot" text-anchor="middle">CB</text>
<rect x="436" y="622" width="68" height="94" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="470" y="649" font-size="24" class="muted" text-anchor="middle">6</text>
<text x="470" y="694" font-size="27" class="slot" text-anchor="middle">OG1</text>
<rect x="514" y="622" width="68" height="94" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="548" y="649" font-size="24" class="muted" text-anchor="middle">7</text>
<text x="548" y="694" font-size="27" class="slot" text-anchor="middle">CG2</text>
<text x="320" y="760" font-size="27" class="heading accent" text-anchor="middle">剩余 7 槽：虚拟标记</text>
<rect x="46" y="784" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="80" y="811" font-size="24" class="muted" text-anchor="middle">8</text>
<text x="80" y="856" font-size="27" class="slot accent" text-anchor="middle">N</text>
<rect x="124" y="784" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="158" y="811" font-size="24" class="muted" text-anchor="middle">9</text>
<text x="158" y="856" font-size="27" class="slot accent" text-anchor="middle">N</text>
<rect x="202" y="784" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="236" y="811" font-size="24" class="muted" text-anchor="middle">10</text>
<text x="236" y="856" font-size="27" class="slot accent" text-anchor="middle">N</text>
<rect x="280" y="784" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="314" y="811" font-size="24" class="muted" text-anchor="middle">11</text>
<text x="314" y="856" font-size="27" class="slot accent" text-anchor="middle">O</text>
<rect x="358" y="784" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="392" y="811" font-size="24" class="muted" text-anchor="middle">12</text>
<text x="392" y="856" font-size="27" class="slot accent" text-anchor="middle">O</text>
<rect x="436" y="784" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="470" y="811" font-size="24" class="muted" text-anchor="middle">13</text>
<text x="470" y="856" font-size="27" class="slot accent" text-anchor="middle">O</text>
<rect x="514" y="784" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="548" y="811" font-size="24" class="muted" text-anchor="middle">14</text>
<text x="548" y="856" font-size="27" class="slot accent" text-anchor="middle">O</text>
<text x="320" y="916" font-size="28" class="secondary" text-anchor="middle">N 处 3 个标记 · O 处 4 个标记</text>
<text x="320" y="950" font-size="26" class="secondary" text-anchor="middle">标记不是物理原子。</text>
<rect x="24" y="996" width="592" height="662" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1041" font-size="29" class="heading" text-anchor="middle">03 · 最近锚点计数，再查表</text>
<text x="320" y="1084" font-size="26" class="secondary" text-anchor="middle">后 10 槽各自寻找前 4 槽中的最近锚点</text>
<text x="320" y="1124" font-size="26" class="secondary" text-anchor="middle">仅在距离不大于 0.5 Å 时计入该锚点</text>
<rect x="52" y="1149" width="520" height="118" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1189" font-size="27" class="secondary" text-anchor="middle">计数顺序：N / CA / C / O</text>
<text x="320" y="1236" font-size="32" class="heading accent" text-anchor="middle">(3, 0, 0, 4) → Thr</text>
<text x="320" y="1310" font-size="28" class="secondary" text-anchor="middle">未匹配合法编码的计数 → UNK</text>
<rect x="52" y="1340" width="520" height="205" rx="8" fill="#F7F8FA" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1384" font-size="27" class="heading" text-anchor="middle">若最近锚点为 N：</text>
<text x="320" y="1430" font-size="30" class="secondary" text-anchor="middle">0.49 Å：计入 N</text>
<text x="320" y="1476" font-size="30" class="secondary" text-anchor="middle">0.51 Å：不计数</text>
<text x="320" y="1518" font-size="24" class="muted" text-anchor="middle">阈值两侧的示例值，非测量数据</text>
<text x="320" y="1588" font-size="26" class="secondary" text-anchor="middle">几何误差小</text>
<text x="320" y="1625" font-size="26" class="secondary" text-anchor="middle">不代表残基身份已经稳定</text>
<path d="M586 1599 H604 V1209 H579" fill="none" stroke="#355C7D" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<rect x="24" y="1686" width="592" height="660" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1731" font-size="30" class="heading" text-anchor="middle">04 · 从连续几何到结构验证</text>
<rect x="72" y="1760" width="496" height="65" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1802" font-size="28" class="secondary" text-anchor="middle">连续坐标噪声</text>
<path d="M320 1833 V1854" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="72" y="1866" width="496" height="65" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1908" font-size="28" class="secondary" text-anchor="middle">去噪后的 14 槽几何</text>
<path d="M320 1939 V1960" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="72" y="1972" width="496" height="65" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2014" font-size="28" class="heading accent" text-anchor="middle">离散残基解码器</text>
<path d="M320 2045 V2066" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="72" y="2078" width="496" height="110" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2120" font-size="28" class="heading accent" text-anchor="middle">Thr 模板：按槽位保留 1–7</text>
<text x="320" y="2160" font-size="28" class="secondary" text-anchor="middle">删除标记槽位 8–14</text>
<path d="M320 2196 V2217" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="72" y="2229" width="496" height="65" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2271" font-size="27" class="heading" text-anchor="middle">仍需化学结构验证</text>
<text x="320" y="2323" font-size="25" class="secondary" text-anchor="middle">身份解码本身不保证化学结构正确</text>
<text x="320" y="2390" font-size="25" class="muted" text-anchor="middle">原创机制示意 · 非实验数据</text>
<text x="320" y="2426" font-size="24" class="muted" text-anchor="middle">并非真实分子坐标 · 箭头表示信息流</text>
</svg>
