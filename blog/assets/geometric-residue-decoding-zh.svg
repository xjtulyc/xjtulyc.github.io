<text x="320" y="553" font-size="30" class="heading" text-anchor="middle">02 · Thr：7 个真实重原子</text>
<text x="320" y="598" font-size="27" class="secondary" text-anchor="middle">4 个主链原子 + 3 个侧链原子</text>
<rect x="46" y="622" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="80" y="649" font-size="24" class="muted" text-anchor="middle">1</text>
<text x="80" y="694" font-size="27" class="slot" text-anchor="middle">N</text>
<rect x="124" y="622" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="158" y="649" font-size="24" class="muted" text-anchor="middle">2</text>
<text x="158" y="694" font-size="27" class="slot" text-anchor="middle">CA</text>
<rect x="202" y="622" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="236" y="649" font-size="24" class="muted" text-anchor="middle">3</text>
<text x="236" y="694" font-size="27" class="slot" text-anchor="middle">C</text>
