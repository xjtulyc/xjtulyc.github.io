<text x="80" y="429" font-size="32" class="slot" text-anchor="middle">8</text>
<rect x="124" y="390" width="68" height="56" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="158" y="429" font-size="32" class="slot" text-anchor="middle">9</text>
