<text x="392" y="429" font-size="32" class="slot" text-anchor="middle">12</text>
<rect x="436" y="390" width="68" height="56" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="470" y="429" font-size="32" class="slot" text-anchor="middle">13</text>
<rect x="514" y="390" width="68" height="56" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="548" y="429" font-size="32" class="slot" text-anchor="middle">14</text>
