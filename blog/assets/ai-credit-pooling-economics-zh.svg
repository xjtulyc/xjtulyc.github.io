<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2530" viewBox="0 0 640 2530" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">池化额度，不等于任务完成</title><desc id="desc">原创概念机制图，非效果测量。席位费用提供本周期的服务使用额度，再按实际用量扣减；额度不是银行账户余额。在同周期、同单价、完全共享、未设个人硬限额的假设例子中，A 和 B 各有 100 单位额度，A 用 160、B 用 40。分开计量时 A 超额 60、B 超额 0，且 B 有 60 单位未用；完全共享时总用量和总额度均为 200，超额为 0。数字是合成额度单位，不是真实产品价格或用户数据，也不代表某厂商的实际池化规则。须核对合同的共享范围、周期、过期与超额规则，不同厂商的 credit 数量不能直接比较。执行前按剩余额度、用户限额及适用且已启用的停止规则决定允许执行或暂停并申请追加预算；预算提醒不自动等于硬停止。一次工作流会话的 AI token 用量与 Runner/Actions 资源用量分别计量，再按任务目标独立验收。池化可能减少闲置额度与超额同时存在，但不能保证计划完成率。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}</style>
<rect width="640" height="2530" fill="#F7F8FA"/>
<text x="32" y="62" font-size="35" class="heading" text-anchor="start">池化额度，不等于任务完成</text>
<text x="32" y="110" font-size="25" class="secondary" text-anchor="start">减少闲置与超额并存，仍需分别验收</text>
<rect x="24" y="154" width="592" height="400" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="200" font-size="30" class="heading" text-anchor="middle">01 · 从席位费到服务计量</text>
<rect x="60" y="226" width="520" height="58" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="265" font-size="29" class="secondary" text-anchor="middle">席位费用</text>
<path d="M320 292 V313" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="324" width="520" height="58" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="363" font-size="29" class="heading accent" text-anchor="middle">本周期可用额度</text>
<path d="M320 390 V411" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="422" width="520" height="58" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="461" font-size="29" class="secondary" text-anchor="middle">按实际用量计量扣减</text>
<text x="320" y="522" font-size="26" class="secondary" text-anchor="middle">服务使用额度，不是银行账户余额</text>
<rect x="24" y="582" width="592" height="810" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="627" font-size="30" class="heading" text-anchor="middle">02 · 同一用量，超额可以不同</text>
<text x="320" y="672" font-size="26" class="secondary" text-anchor="middle">概念假设：同周期、同单价、完全共享</text>
<text x="320" y="710" font-size="26" class="secondary" text-anchor="middle">本例不设个人硬限额</text>
<rect x="48" y="738" width="544" height="214" rx="8" fill="#F7F8FA" stroke="#D9E1E8" stroke-width="2"/>
<path d="M48 794 H592 M48 873 H592" fill="none" stroke="#D9E1E8" stroke-width="2"/>
<text x="106" y="776" font-size="27" class="heading" text-anchor="middle">用户</text>
<text x="248" y="776" font-size="27" class="heading" text-anchor="middle">额度</text>
<text x="390" y="776" font-size="27" class="heading" text-anchor="middle">用量</text>
<text x="529" y="776" font-size="27" class="heading" text-anchor="middle">超额</text>
<text x="106" y="845" font-size="32" class="secondary" text-anchor="middle">A</text>
<text x="248" y="845" font-size="32" class="secondary" text-anchor="middle">100</text>
<text x="390" y="845" font-size="32" class="secondary" text-anchor="middle">160</text>
<text x="529" y="845" font-size="32" class="heading accent" text-anchor="middle">60</text>
<text x="106" y="925" font-size="32" class="secondary" text-anchor="middle">B</text>
<text x="248" y="925" font-size="32" class="secondary" text-anchor="middle">100</text>
<text x="390" y="925" font-size="32" class="secondary" text-anchor="middle">40</text>
<text x="529" y="925" font-size="32" class="heading accent" text-anchor="middle">0</text>
<rect x="48" y="980" width="264" height="108" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<rect x="328" y="980" width="264" height="108" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="180" y="1020" font-size="27" class="heading" text-anchor="middle">分开计量的超额</text>
<text x="180" y="1066" font-size="38" class="heading accent" text-anchor="middle">60</text>
<text x="460" y="1020" font-size="27" class="heading" text-anchor="middle">完全共享的超额</text>
<text x="460" y="1066" font-size="38" class="heading accent" text-anchor="middle">0</text>
<text x="320" y="1133" font-size="27" class="secondary" text-anchor="middle">分开时：B 闲置 60，A 超额 60</text>
<text x="320" y="1173" font-size="27" class="secondary" text-anchor="middle">共享时：总用量 200，总额度 200</text>
<rect x="48" y="1210" width="544" height="154" rx="8" fill="#F7F8FA" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="1251" font-size="24" class="secondary" text-anchor="middle">假设额度单位，非产品价格或用户数据</text>
<text x="320" y="1291" font-size="24" class="secondary" text-anchor="middle">真实合同：核对共享范围、周期、过期、超额</text>
<text x="320" y="1331" font-size="24" class="heading accent" text-anchor="middle">不同厂商的 credit 数量不可直接比较</text>
<rect x="24" y="1420" width="592" height="450" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1466" font-size="30" class="heading" text-anchor="middle">03 · 按明确规则决定能否执行</text>
<rect x="60" y="1494" width="520" height="92" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1533" font-size="28" class="heading accent" text-anchor="middle">剩余额度 · 用户限额</text>
<text x="320" y="1571" font-size="27" class="secondary" text-anchor="middle">适用且已启用的停止规则</text>
<path d="M320 1594 V1618 H180 V1637" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M320 1618 H460 V1637" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="1648" width="264" height="100" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<rect x="328" y="1648" width="264" height="100" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="180" y="1708" font-size="28" class="heading" text-anchor="middle">允许执行</text>
<text x="460" y="1687" font-size="27" class="heading" text-anchor="middle">暂停 / 申请</text>
<text x="460" y="1726" font-size="27" class="heading" text-anchor="middle">追加预算</text>
<text x="320" y="1803" font-size="27" class="secondary" text-anchor="middle">预算提醒不自动等于硬停止</text>
<text x="320" y="1842" font-size="26" class="secondary" text-anchor="middle">核对产品规则及实际启用的设置</text>
<rect x="24" y="1898" width="592" height="514" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1944" font-size="30" class="heading" text-anchor="middle">04 · 工作流仍有计量与验收接口</text>
<rect x="72" y="1972" width="496" height="66" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2015" font-size="29" class="heading" text-anchor="middle">一次工作流会话</text>
<path d="M320 2046 V2068 H180 V2088" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M320 2068 H460 V2088" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="2100" width="264" height="100" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<rect x="328" y="2100" width="264" height="100" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="180" y="2140" font-size="27" class="heading accent" text-anchor="middle">AI token</text>
<text x="180" y="2178" font-size="27" class="secondary" text-anchor="middle">用量账</text>
<text x="460" y="2140" font-size="27" class="heading accent" text-anchor="middle">Runner / Actions</text>
<text x="460" y="2178" font-size="27" class="secondary" text-anchor="middle">资源用量账</text>
<path d="M180 2208 V2230 H320 V2250" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M460 2208 V2230 H320" fill="none" stroke="#355C7D" stroke-width="2.5"/>
<rect x="60" y="2262" width="520" height="60" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2302" font-size="29" class="heading" text-anchor="middle">按任务目标独立验收</text>
<text x="320" y="2361" font-size="26" class="secondary" text-anchor="middle">分别核对两种计量口径</text>
<text x="320" y="2396" font-size="26" class="heading accent" text-anchor="middle">池化不能保证计划完成率</text>
<text x="320" y="2470" font-size="25" class="muted" text-anchor="middle">原创概念机制图 · 非效果测量</text>
<text x="320" y="2506" font-size="24" class="muted" text-anchor="middle">算例为假设单位 · 非任一厂商实际方案</text>
</svg>
