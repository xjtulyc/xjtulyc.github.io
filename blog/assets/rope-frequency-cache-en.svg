<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2080" viewBox="0 0 640 2080" role="img" aria-labelledby="title desc"><title id="title">Original mechanism diagram contrasting full recomputation at frozen new frequencies with changing frequencies after building a historical cache. Rephasing repairs old key coordinates only; deep hidden states and values may still differ.</title><desc id="desc">Figure 1 | Cache consistency has two conditions: matching rotation coordinates and matching historical content. Original analytical schematic, not experimental data. The paths are comparison protocols, not the defaults of every implementation.</desc><rect width="640" height="2080" fill="#F7F8FA"/><g font-family="Arial, Noto Sans SC, sans-serif" text-anchor="middle" fill="#1F2933"><text x="320" y="64" font-size="32" font-weight="700">RoPE and the KV cache</text><text x="320" y="108" font-size="26" fill="#526171">Define the target computation</text><rect x="22" y="146" width="596" height="254" rx="7" fill="#EDF2F6" stroke="#D9E1E8"/><text x="320" y="195" font-size="28" font-weight="700" fill="#355C7D">Baseline · Frozen new settings</text><text x="320" y="244" font-size="25" font-weight="400" fill="#526171">Select frequencies and scales first</text><text x="320" y="293" font-size="25" font-weight="400" fill="#526171">Full prefill / chunks / decode</text><text x="320" y="342" font-size="25" font-weight="400" fill="#526171">One protocol and causal mask</text><rect x="22" y="461" width="596" height="254" rx="7" fill="#FFFFFF" stroke="#D9E1E8"/><text x="320" y="510" font-size="28" font-weight="700" fill="#355C7D">01 · Old historical cache</text><text x="320" y="559" font-size="25" font-weight="400" fill="#526171">Cache rotated keys at each layer</text><text x="320" y="608" font-size="25" font-weight="400" fill="#526171">Retain historical values too</text><text x="320" y="657" font-size="25" font-weight="400" fill="#526171">Upstream states use old settings</text><path d="M320 728v32m-8-8 8 8 8-8" fill="none" stroke="#355C7D" stroke-width="3"/><rect x="22" y="776" width="596" height="254" rx="7" fill="#FFFFFF" stroke="#D9E1E8"/><text x="320" y="825" font-size="28" font-weight="700" fill="#355C7D">02 · Frequencies change now</text><text x="320" y="874" font-size="25" font-weight="400" fill="#526171">New queries meet old keys</text><text x="320" y="923" font-size="25" font-weight="400" fill="#526171">An absolute-position phase remains</text><text x="320" y="972" font-size="25" font-weight="400" fill="#526171">Not automatically the frozen target</text><path d="M320 1043v32m-8-8 8 8 8-8" fill="none" stroke="#355C7D" stroke-width="3"/><rect x="22" y="1091" width="596" height="254" rx="7" fill="#FFFFFF" stroke="#D9E1E8"/><text x="320" y="1140" font-size="28" font-weight="700" fill="#355C7D">03 · Repair rotation coordinates</text><text x="320" y="1189" font-size="25" font-weight="400" fill="#526171">Invert old rotation, apply new one</text><text x="320" y="1238" font-size="25" font-weight="400" fill="#526171">Correct changed amplitude too</text><text x="320" y="1287" font-size="25" font-weight="400" fill="#526171">Local equality with fixed content</text><path d="M320 1358v32m-8-8 8 8 8-8" fill="none" stroke="#355C7D" stroke-width="3"/><rect x="22" y="1406" width="596" height="254" rx="7" fill="#FFFFFF" stroke="#D9E1E8"/><text x="320" y="1455" font-size="28" font-weight="700" fill="#355C7D">04 · Deep content can still differ</text><text x="320" y="1504" font-size="25" font-weight="400" fill="#526171">Old attention shapes past states</text><text x="320" y="1553" font-size="25" font-weight="400" fill="#526171">Deep keys and values may change</text><text x="320" y="1602" font-size="25" font-weight="400" fill="#526171">Rephasing does not rebuild history</text><path d="M320 1673v32m-8-8 8 8 8-8" fill="none" stroke="#355C7D" stroke-width="3"/><rect x="22" y="1721" width="596" height="254" rx="7" fill="#EDF2F6" stroke="#D9E1E8"/><text x="320" y="1770" font-size="28" font-weight="700" fill="#355C7D">Acceptance: coordinates + content</text><text x="320" y="1819" font-size="25" font-weight="400" fill="#526171">Choose freeze / rebuild / online</text><text x="320" y="1868" font-size="25" font-weight="400" fill="#526171">Check layers, then cost and quality</text><text x="320" y="1917" font-size="25" font-weight="400" fill="#526171">Original schematic · not data</text></g></svg>