<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">从低误差到可靠分子动力学</title><desc id="desc">原创四层分析示意，非实测数据。低静态测试误差并不足以证明分子动力学可靠。第一层检查单值平滑能量面、由同一能量负梯度得到的力及导数的连续性与有界性；第二层检查避免按最近K个邻居硬切换以及边消息在距离截断处平滑衰减；第三层扫描积分时间步并比较数值精度与积分误差；第四层分别检查NVE下动能加势能的漂移以检验数值一致性，以及独立DFT或物性参照下的物理准确性。能量守恒本身不证明物性准确。这是检查框架，不是对所有算法的充分保证。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}</style>
<rect width="640" height="1600" fill="#F7F8FA"/>
<text x="32" y="56" font-size="34" class="heading" text-anchor="start">从低误差到可靠分子动力学</text>
<text x="32" y="130" font-size="26" class="secondary" text-anchor="start">势模型、实现与积分器分层检查</text>
<rect x="40" y="162" width="560" height="92" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="199" font-size="30" class="heading" text-anchor="middle">静态测试误差较低</text>
<text x="320" y="236" font-size="27" class="secondary" text-anchor="middle">仍需检验动态行为</text>
<path d="M320 260 V285" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="294" width="560" height="204" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="337" font-size="30" class="heading accent" text-anchor="middle">01  势模型</text>
<text x="320" y="382" font-size="27" class="secondary" text-anchor="middle">单值、平滑的能量面</text>
<text x="320" y="421" font-size="27" class="secondary" text-anchor="middle">力取自同一能量的负梯度</text>
<text x="320" y="460" font-size="27" class="secondary" text-anchor="middle">检查导数的连续性与有界性</text>
<path d="M320 504 V529" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="538" width="560" height="204" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="581" font-size="30" class="heading accent" text-anchor="middle">02  图与截断</text>
<text x="320" y="626" font-size="27" class="secondary" text-anchor="middle">避免按最近 K 个邻居硬切换</text>
<text x="320" y="665" font-size="27" class="secondary" text-anchor="middle">边消息在距离截断处</text>
<text x="320" y="704" font-size="27" class="secondary" text-anchor="middle">平滑衰减</text>
<path d="M320 748 V773" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="782" width="560" height="168" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="825" font-size="30" class="heading accent" text-anchor="middle">03  积分器与数值精度</text>
<text x="320" y="870" font-size="27" class="secondary" text-anchor="middle">扫描积分时间步</text>
<text x="320" y="909" font-size="27" class="secondary" text-anchor="middle">比较数值精度与积分误差</text>
<path d="M320 956 V981" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="990" width="560" height="402" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1036" font-size="30" class="heading accent" text-anchor="middle">04  轨迹与物性</text>
<rect x="60" y="1064" width="520" height="152" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1106" font-size="29" class="heading" text-anchor="middle">NVE 总能量漂移</text>
<text x="320" y="1145" font-size="27" class="secondary" text-anchor="middle">检查动能与势能之和</text>
<text x="320" y="1184" font-size="27" class="secondary" text-anchor="middle">检验数值一致性</text>
<rect x="60" y="1240" width="520" height="126" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1287" font-size="28" class="heading" text-anchor="middle">独立 DFT / 物性对照</text>
<text x="320" y="1330" font-size="27" class="secondary" text-anchor="middle">另行检验物理准确性</text>
<text x="320" y="1441" font-size="28" class="heading" text-anchor="middle">守恒本身不能证明物性准确</text>
<text x="320" y="1564" font-size="25" class="muted" text-anchor="middle">原创分析示意 · 非实测数据</text>
</svg>
