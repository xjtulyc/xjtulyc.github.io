<text x="32" y="86" font-size="26" class="secondary" text-anchor="start">Cash is not yet revenue or business return</text>
<rect x="48" y="120" width="544" height="70" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="165" font-size="32" class="heading" text-anchor="middle">Buyer prepayment</text>
