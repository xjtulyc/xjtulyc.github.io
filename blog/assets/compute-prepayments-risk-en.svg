<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1410" viewBox="0 0 640 1410" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Compute prepayments: three ledgers</title><desc id="desc">Generic compute-prepayment mechanism; no specific company transaction is depicted. A buyer prepays and the supplier receives cash. Only the deployable portion can fund construction. Power, cooling, network and cluster delivery and acceptance must produce usable service; the supplier retains delivery obligations. Two separate branches follow. Supplier revenue is recognized as contracted obligations are fulfilled, over the service period or with usage. The buyer needs external payments or internal incremental value to inform renewal and payback decisions and bears underuse and demand-change risks. Buyer business returns are not drawn as a prerequisite for supplier revenue recognition. Cash receipt, contract revenue and business returns require separate checks. Not experimental data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}</style>
<rect width="640" height="1410" fill="#F7F8FA"/>
