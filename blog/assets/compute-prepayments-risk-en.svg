<text x="320" y="411" font-size="30" class="heading" text-anchor="middle">Power, cooling, network &amp; cluster</text>
<text x="320" y="456" font-size="28" class="" text-anchor="middle">Delivery and acceptance</text>
<text x="320" y="514" font-size="26" class="secondary" text-anchor="middle">Supplier risk: delivery obligations</text>
<path d="M320 544 V563" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="570" width="544" height="70" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
