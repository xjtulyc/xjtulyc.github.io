<text x="332" y="953" font-size="28" class="heading accent" text-anchor="middle">03  Buyer’s business return</text>
<text x="332" y="996" font-size="28" class="" text-anchor="middle">External payments or</text>
<text x="332" y="1031" font-size="28" class="" text-anchor="middle">internal incremental value</text>
<text x="332" y="1074" font-size="26" class="" text-anchor="middle">Inform renewal and payback decisions</text>
