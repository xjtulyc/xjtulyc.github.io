<path d="M36 1023 H67" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="74" y="690" width="516" height="176" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="332" y="733" font-size="28" class="heading accent" text-anchor="middle">02  Supplier contract revenue</text>
<text x="332" y="772" font-size="28" class="" text-anchor="middle">Recognized as contracted</text>
