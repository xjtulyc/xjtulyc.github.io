<svg xmlns="http://www.w3.org/2000/svg" width="600" height="940" viewBox="0 0 600 940" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">结构与亲和力之间，还缺什么？</title><desc id="desc">三个量，需要三类证据. 原创概念示意 · 非实验数据</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="none" stroke="#607080" stroke-width="1.5"/></marker></defs>
<rect width="600" height="940" rx="20" fill="#F7F8FA"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="48" font-size="30" fill="#182D49" font-weight="700" text-anchor="start">结构与亲和力之间，还缺什么？</text>
<text x="28" y="86" font-size="23" fill="#526171" font-weight="400" text-anchor="start">三个量，需要三类证据</text>
<rect x="20" y="112" width="560" height="160" rx="14" fill="#FFFFFF" stroke="#D9E1E8"/>
<text x="38" y="151" font-size="28" fill="#355C7D" font-weight="700" text-anchor="start">01  结构坐标</text>
<text x="38" y="196" font-size="25" fill="#526171" font-weight="400" text-anchor="start">一个代表性的结合姿态</text>
<text x="38" y="238" font-size="23" fill="#526171" font-weight="400" text-anchor="start">几何合理 ≠ 统计权重已知</text>
<rect x="20" y="304" width="560" height="160" rx="14" fill="#FFFFFF" stroke="#D9E1E8"/>
<text x="38" y="343" font-size="28" fill="#355C7D" font-weight="700" text-anchor="start">02  结合态 / 游离态系综</text>
<text x="38" y="388" font-size="25" fill="#526171" font-weight="400" text-anchor="start">比较两种状态的自由能</text>
<text x="38" y="430" font-size="23" fill="#526171" font-weight="400" text-anchor="start">溶剂 · 构象 · 质子化 · 标准态</text>
<rect x="20" y="496" width="560" height="160" rx="14" fill="#FFFFFF" stroke="#D9E1E8"/>
<text x="38" y="535" font-size="28" fill="#355C7D" font-weight="700" text-anchor="start">03  平衡亲和力</text>
<text x="38" y="580" font-size="25" fill="#526171" font-weight="400" text-anchor="start">由标准态自由能联系到结合强弱</text>
<text x="38" y="622" font-size="23" fill="#526171" font-weight="400" text-anchor="start">平衡与解离速率需要分别判断</text>
<path d="M300 278 V298" stroke="#607080" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M300 470 V490" stroke="#607080" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="300" y="691" font-size="23" fill="#526171" font-weight="400" text-anchor="middle">相同亲和力，不代表相同解离速率</text>
<text x="28" y="745" font-size="27" fill="#182D49" font-weight="700" text-anchor="start">验证要分别回答</text>
<circle cx="35" cy="780" r="5" fill="#355C7D"/>
<text x="52" y="788" font-size="24" fill="#1F2933" font-weight="400" text-anchor="start">结构：参考坐标与物理检查</text>
<circle cx="35" cy="825" r="5" fill="#355C7D"/>
<text x="52" y="833" font-size="24" fill="#1F2933" font-weight="400" text-anchor="start">预测：独立划分与简单基线</text>
<circle cx="35" cy="870" r="5" fill="#355C7D"/>
<text x="52" y="878" font-size="24" fill="#1F2933" font-weight="400" text-anchor="start">实验：一致条件下的盲测复验</text>
<text x="300" y="921" font-size="19" fill="#607080" font-weight="400" text-anchor="middle">原创概念示意 · 非实验数据</text>
</g></svg>
