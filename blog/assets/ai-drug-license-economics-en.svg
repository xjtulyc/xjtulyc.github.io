<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2550" viewBox="0 0 640 2550" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">AI drug licensing</title><desc id="desc">Original transaction-mechanism illustration, not experimental or transaction-outcome data. Software access, agreed research deliverables, and drug-asset rights with an evidence package are parallel contract objects rather than an inevitable progression. Only the drug-asset license is expanded: evidence and intellectual-property diligence checks evidence, ownership and licensing authority; the contract defines licensed scope, territory and party obligations; the buyer undertakes downstream development, manufacturing and commercial execution according to the contractual allocation of responsibilities. The payment categories are assessed separately: upfront payment requires checking payment conditions and cash received; development, regulatory and commercial milestones depend on specified triggers; sales royalties depend on agreed sales bases and terms. A headline total cannot be treated directly as cash received or current revenue. Signing, handover and performance, and accounting revenue recognition are different assessments, with cash and revenue timing checked separately. Technical efficiency may add asset options, but realization depends on evidence, rights and downstream progress; faster discovery does not demonstrate clinical success. Arrows represent information and contract-analysis flow, not a company’s measured results or a guaranteed commercial outcome.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
