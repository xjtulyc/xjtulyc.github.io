<text x="548" y="856" font-size="27" class="slot accent" text-anchor="middle">O</text>
<text x="320" y="916" font-size="28" class="secondary" text-anchor="middle">3 markers at N · 4 markers at O</text>
<text x="320" y="950" font-size="26" class="secondary" text-anchor="middle">Markers are not physical atoms.</text>
<rect x="24" y="996" width="592" height="662" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1041" font-size="29" class="heading" text-anchor="middle">03 · Nearest-anchor counts, then lookup</text>
<text x="320" y="1084" font-size="26" class="secondary" text-anchor="middle">Each later slot selects its nearest anchor</text>
<text x="320" y="1124" font-size="26" class="secondary" text-anchor="middle">Count only when the distance is at most 0.5 Å</text>
<rect x="52" y="1149" width="520" height="118" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1189" font-size="27" class="secondary" text-anchor="middle">Count order: N / CA / C / O</text>
<text x="320" y="1236" font-size="32" class="heading accent" text-anchor="middle">(3, 0, 0, 4) → Thr</text>
<text x="320" y="1310" font-size="28" class="secondary" text-anchor="middle">Unmatched count pattern → UNK</text>
<rect x="52" y="1340" width="520" height="205" rx="8" fill="#F7F8FA" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1384" font-size="27" class="heading" text-anchor="middle">If N is the nearest anchor:</text>
<text x="320" y="1430" font-size="30" class="secondary" text-anchor="middle">0.49 Å: count at N</text>
<text x="320" y="1476" font-size="30" class="secondary" text-anchor="middle">0.51 Å: do not count</text>
<text x="320" y="1518" font-size="24" class="muted" text-anchor="middle">Illustrative values, not measurements</text>
<text x="320" y="1588" font-size="26" class="secondary" text-anchor="middle">Small geometry error does not ensure</text>
<text x="320" y="1625" font-size="26" class="secondary" text-anchor="middle">stable residue identity.</text>
<path d="M586 1599 H604 V1209 H579" fill="none" stroke="#355C7D" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<rect x="24" y="1686" width="592" height="660" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1731" font-size="30" class="heading" text-anchor="middle">04 · From geometry to validation</text>
<rect x="72" y="1760" width="496" height="65" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1802" font-size="28" class="secondary" text-anchor="middle">Continuous coordinate noise</text>
<path d="M320 1833 V1854" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="72" y="1866" width="496" height="65" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1908" font-size="28" class="secondary" text-anchor="middle">Denoised 14-slot geometry</text>
<path d="M320 1939 V1960" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="72" y="1972" width="496" height="65" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2014" font-size="28" class="heading accent" text-anchor="middle">Discrete residue decoder</text>
<path d="M320 2045 V2066" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="72" y="2078" width="496" height="110" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2120" font-size="28" class="heading accent" text-anchor="middle">Thr template: retain slots 1–7</text>
<text x="320" y="2160" font-size="28" class="secondary" text-anchor="middle">Remove marker slots 8–14</text>
<path d="M320 2196 V2217" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="72" y="2229" width="496" height="65" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2271" font-size="27" class="heading" text-anchor="middle">Chemical validation is still required</text>
<text x="320" y="2323" font-size="25" class="secondary" text-anchor="middle">Decoding identity is not a chemistry check</text>
<text x="320" y="2390" font-size="25" class="muted" text-anchor="middle">Original mechanism · Not experimental data</text>
<text x="320" y="2426" font-size="24" class="muted" text-anchor="middle">Not molecular coordinates · Arrows = information flow</text>
</svg>
