<text x="158" y="649" font-size="24" class="muted" text-anchor="middle">2</text>
<text x="158" y="694" font-size="27" class="slot" text-anchor="middle">CA</text>
<rect x="202" y="622" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="236" y="649" font-size="24" class="muted" text-anchor="middle">3</text>
<text x="236" y="694" font-size="27" class="slot" text-anchor="middle">C</text>
<rect x="280" y="622" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
