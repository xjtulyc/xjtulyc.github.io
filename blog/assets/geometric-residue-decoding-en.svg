<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2450" viewBox="0 0 640 2450" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Discrete identity in geometry</title><desc id="desc">Original atom14 mechanism, not molecular coordinates or experimental data; arrows represent information flow. The fixed representation has 14 slots: the first four are backbone N, CA, C and O, and the later ten contain side-chain heavy atoms and virtual markers. For Thr, slots 1–7 are N, CA, C, O, CB, OG1 and CG2; slots 8–10 are markers at N and slots 11–14 are markers at O. These seven markers are not physical atoms. The pinned decoder assigns each later slot to its nearest backbone anchor and counts it only if the distance is at most 0.5 Å. Counts ordered as N, CA, C and O give (3,0,0,4) for Thr; unmatched patterns yield UNK. If N is the nearest anchor, a distance of 0.49 Å contributes to N while 0.51 Å does not contribute. These illustrative values show how a small geometric perturbation may cross a discrete boundary, not an experimental result. Continuous noise is denoised to geometry, followed by residue decoding. The Thr template retains the first seven slots and removes the seven marker slots. Independent chemical validation remains necessary.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}.slot{font-family:Arial,"PingFang SC",sans-serif;font-weight:700}</style>
