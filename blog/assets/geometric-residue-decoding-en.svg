<text x="320" y="553" font-size="30" class="heading" text-anchor="middle">02 · Thr: seven real heavy atoms</text>
<text x="320" y="598" font-size="27" class="secondary" text-anchor="middle">4 backbone atoms + 3 side-chain atoms</text>
<rect x="46" y="622" width="68" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="80" y="649" font-size="24" class="muted" text-anchor="middle">1</text>
<text x="80" y="694" font-size="27" class="slot" text-anchor="middle">N</text>
