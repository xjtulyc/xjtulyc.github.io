<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2648" viewBox="0 0 640 2648" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">AlphaGenome Atlas: Three layers of meaning in an AVI score</title><desc id="desc">Original mechanism illustration, not experimental data; no model run, patient data or measured curves. Layer one comprises molecular effect scorers for GRCh38 REF and ALT alleles. Inputs include ten AlphaGenome features: nine maximum-absolute-effect features over relevant dimensions and one merged-splicing feature. Four coding features, two conservation features and two indel-type indicators complete the eighteen inputs. Feature maxima may come from different tissues and cannot establish a joint mechanism in one cell. Active-allele scorers are excluded; only AlphaGenome features and Cactus use training-set normalization scales. Layer two is AVI: sixteen primary features and two type indicators enter the models, and six models’ raw logits are averaged. Stratified, balanced gnomAD rare/common frequency-proxy labels form a separate training-supervision path, not direct clinical pathogenicity labels. Model selection uses functional-assay and trait-association validation data. Layer three maps model output to PHRED rank against a fixed all-SNV reference. A score of twenty means the top one percent of that reference, not a ninety-nine percent probability of pathogenicity. Indels map to the same SNV reference. Re-ranking a filtered candidate subset does not reproduce the original AVI PHRED. Follow-up compares REF and ALT tracks in the same biosample and brings in original assays, tissue, phenotype, inheritance and independent validation to form interpretation hypotheses and candidate priorities, not a stand-alone clinical conclusion.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}</style>
<rect width="640" height="2648" fill="#F7F8FA"/>
<text x="32" y="62" font-size="37" class="heading" text-anchor="start">AlphaGenome Atlas</text>
<text x="32" y="111" font-size="29" class="secondary" text-anchor="start">Three layers of meaning in an AVI score</text>
<rect x="24" y="154" width="592" height="688" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="198" font-size="29" class="heading" text-anchor="middle">01 · Molecular effects and features</text>
<rect x="48" y="226" width="544" height="84" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="262" font-size="30" class="heading" text-anchor="middle">GRCh38: REF / ALT</text>
<text x="320" y="294" font-size="25" class="secondary" text-anchor="middle">Paired-allele molecular effect scorers</text>
<path d="M320 318 V346" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="358" width="544" height="124" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="398" font-size="29" class="heading accent" text-anchor="middle">10 AlphaGenome features</text>
<text x="320" y="438" font-size="26" class="secondary" text-anchor="middle">9 max-absolute + 1 merged splicing</text>
<text x="320" y="469" font-size="24" class="secondary" text-anchor="middle">Aggregate across relevant scoring dimensions</text>
<rect x="48" y="510" width="544" height="148" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="550" font-size="27" class="heading" text-anchor="middle">Add 4 coding features</text>
<text x="320" y="589" font-size="26" class="secondary" text-anchor="middle">2 conservation + 2 indel-type indicators</text>
<text x="320" y="631" font-size="30" class="heading accent" text-anchor="middle">18 input features in total</text>
<text x="320" y="698" font-size="26" class="secondary" text-anchor="middle">Maxima may come from different tissues</text>
<text x="320" y="734" font-size="26" class="secondary" text-anchor="middle">Not a joint mechanism in one cell</text>
<text x="320" y="780" font-size="25" class="muted" text-anchor="middle">Active-allele scorers are excluded</text>
<text x="320" y="816" font-size="25" class="muted" text-anchor="middle">Training-set scales: AG and Cactus only</text>
<rect x="24" y="870" width="592" height="622" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="916" font-size="29" class="heading" text-anchor="middle">02 · The AVI model output</text>
<rect x="64" y="944" width="528" height="124" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="981" font-size="27" class="heading" text-anchor="middle">16 primary features + 2 type indicators</text>
<text x="320" y="1017" font-size="25" class="secondary" text-anchor="middle">Input to AVI models</text>
<text x="320" y="1051" font-size="28" class="heading accent" text-anchor="middle">Mean of 6 models’ raw logits</text>
<rect x="64" y="1104" width="528" height="156" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="1138" font-size="25" class="heading" text-anchor="middle">Training supervision only (separate)</text>
<text x="320" y="1176" font-size="28" class="heading" text-anchor="middle">gnomAD frequency-proxy labels</text>
<text x="320" y="1214" font-size="25" class="secondary" text-anchor="middle">Rare / common: stratified and balanced</text>
<text x="320" y="1247" font-size="24" class="secondary" text-anchor="middle">Not direct clinical pathogenicity labels</text>
<path d="M58 1170 H42 V1006 H58" fill="none" stroke="#355C7D" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<rect x="48" y="1296" width="544" height="96" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1334" font-size="27" class="heading" text-anchor="middle">Model selection on validation data</text>
<text x="320" y="1374" font-size="26" class="secondary" text-anchor="middle">Functional assays and trait associations</text>
<text x="320" y="1432" font-size="27" class="secondary" text-anchor="middle">A model ranking signal</text>
<text x="320" y="1468" font-size="27" class="heading accent" text-anchor="middle">Not a direct disease probability</text>
<rect x="24" y="1520" width="592" height="574" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1568" font-size="28" class="heading" text-anchor="middle">03 · PHRED against a fixed reference</text>
<rect x="48" y="1594" width="544" height="108" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1635" font-size="26" class="heading" text-anchor="middle">Fixed reference: all-SNV score distribution</text>
<text x="320" y="1678" font-size="26" class="secondary" text-anchor="middle">Map the raw model output to rank</text>
<path d="M320 1710 V1732" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="1744" width="544" height="108" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1784" font-size="33" class="heading accent" text-anchor="middle">PHRED 20</text>
<text x="320" y="1827" font-size="28" class="heading" text-anchor="middle">Top 1% of the all-SNV reference</text>
<text x="320" y="1896" font-size="27" class="heading accent" text-anchor="middle">Not a 99% probability of pathogenicity</text>
<text x="320" y="1940" font-size="26" class="secondary" text-anchor="middle">Indels use the same SNV reference</text>
<text x="320" y="1985" font-size="25" class="secondary" text-anchor="middle">Do not re-rank a selected candidate subset</text>
<text x="320" y="2021" font-size="25" class="secondary" text-anchor="middle">and call it the original AVI PHRED score</text>
<text x="320" y="2067" font-size="25" class="muted" text-anchor="middle">Report subset ranks separately</text>
<rect x="24" y="2122" width="592" height="408" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2168" font-size="28" class="heading" text-anchor="middle">Follow up: from ranking to hypotheses</text>
<rect x="48" y="2196" width="544" height="144" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2234" font-size="26" class="secondary" text-anchor="middle">REF / ALT tracks in the same biosample</text>
<text x="320" y="2276" font-size="26" class="secondary" text-anchor="middle">Original assays, tissue and phenotype</text>
<text x="320" y="2318" font-size="26" class="secondary" text-anchor="middle">Inheritance and independent validation</text>
<path d="M320 2348 V2372" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="2384" width="544" height="110" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2427" font-size="27" class="heading" text-anchor="middle">Interpretation hypotheses and priorities</text>
<text x="320" y="2470" font-size="27" class="heading accent" text-anchor="middle">Not a stand-alone clinical conclusion</text>
<text x="320" y="2576" font-size="24" class="muted" text-anchor="middle">Original mechanism · Not experimental data</text>
<text x="320" y="2615" font-size="24" class="muted" text-anchor="middle">No model run, patient data or measured curves</text>
</svg>
