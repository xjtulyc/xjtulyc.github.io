<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2080" viewBox="0 0 640 2080" role="img" aria-labelledby="title desc"><title id="title">原创机制示意：冻结新频率并重算整段的目标，与旧频率构建历史缓存后改频率的路径对照；重相位仅修旧键坐标，深层隐藏状态和值仍可能不同。</title><desc id="desc">图 1｜缓存一致性的两层条件：旋转坐标一致与历史内容一致。原创分析示意，非实验数据；图中的路径是比较协议，不是所有实现的默认行为。</desc><rect width="640" height="2080" fill="#F7F8FA"/><g font-family="Arial, Noto Sans SC, sans-serif" text-anchor="middle" fill="#1F2933"><text x="320" y="64" font-size="32" font-weight="700">RoPE 与 KV cache</text><text x="320" y="108" font-size="26" fill="#526171">先定义目标计算</text><rect x="22" y="146" width="596" height="254" rx="7" fill="#EDF2F6" stroke="#D9E1E8"/><text x="320" y="195" font-size="28" font-weight="700" fill="#355C7D">基线 · 冻结新协议</text><text x="320" y="244" font-size="25" font-weight="400" fill="#526171">请求前选定频率与尺度</text><text x="320" y="293" font-size="25" font-weight="400" fill="#526171">全段 prefill / 分块 / decode</text><text x="320" y="342" font-size="25" font-weight="400" fill="#526171">使用同一协议和因果掩码</text><rect x="22" y="461" width="596" height="254" rx="7" fill="#FFFFFF" stroke="#D9E1E8"/><text x="320" y="510" font-size="28" font-weight="700" fill="#355C7D">01 · 待检的旧历史缓存</text><text x="320" y="559" font-size="25" font-weight="400" fill="#526171">逐层缓存已旋转的 key</text><text x="320" y="608" font-size="25" font-weight="400" fill="#526171">同时保留历史 value</text><text x="320" y="657" font-size="25" font-weight="400" fill="#526171">上游隐藏状态来自旧协议</text><path d="M320 728v32m-8-8 8 8 8-8" fill="none" stroke="#355C7D" stroke-width="3"/><rect x="22" y="776" width="596" height="254" rx="7" fill="#FFFFFF" stroke="#D9E1E8"/><text x="320" y="825" font-size="28" font-weight="700" fill="#355C7D">02 · 当前请求改频率</text><text x="320" y="874" font-size="25" font-weight="400" fill="#526171">新 query 与旧 key 相遇</text><text x="320" y="923" font-size="25" font-weight="400" fill="#526171">出现额外的绝对位置相位</text><text x="320" y="972" font-size="25" font-weight="400" fill="#526171">结果不自动等于冻结新协议</text><path d="M320 1043v32m-8-8 8 8 8-8" fill="none" stroke="#355C7D" stroke-width="3"/><rect x="22" y="1091" width="596" height="254" rx="7" fill="#FFFFFF" stroke="#D9E1E8"/><text x="320" y="1140" font-size="28" font-weight="700" fill="#355C7D">03 · 仅修旋转坐标</text><text x="320" y="1189" font-size="25" font-weight="400" fill="#526171">逆旧旋转，再施加新旋转</text><text x="320" y="1238" font-size="25" font-weight="400" fill="#526171">尺度变化也必须处理</text><text x="320" y="1287" font-size="25" font-weight="400" fill="#526171">固定内容投影时局部等价</text><path d="M320 1358v32m-8-8 8 8 8-8" fill="none" stroke="#355C7D" stroke-width="3"/><rect x="22" y="1406" width="596" height="254" rx="7" fill="#FFFFFF" stroke="#D9E1E8"/><text x="320" y="1455" font-size="28" font-weight="700" fill="#355C7D">04 · 深层内容仍可能不同</text><text x="320" y="1504" font-size="25" font-weight="400" fill="#526171">旧注意力影响历史隐藏状态</text><text x="320" y="1553" font-size="25" font-weight="400" fill="#526171">深层 key 和 value 可能变化</text><text x="320" y="1602" font-size="25" font-weight="400" fill="#526171">重旋转不自动重建整段</text><path d="M320 1673v32m-8-8 8 8 8-8" fill="none" stroke="#355C7D" stroke-width="3"/><rect x="22" y="1721" width="596" height="254" rx="7" fill="#EDF2F6" stroke="#D9E1E8"/><text x="320" y="1770" font-size="28" font-weight="700" fill="#355C7D">验收：坐标与内容同时一致</text><text x="320" y="1819" font-size="25" font-weight="400" fill="#526171">选定冻结 / 重建 / 在线协议</text><text x="320" y="1868" font-size="25" font-weight="400" fill="#526171">逐层比较，再评估成本与质量</text><text x="320" y="1917" font-size="25" font-weight="400" fill="#526171">原创机制示意 · 非实验数据</text></g></svg>