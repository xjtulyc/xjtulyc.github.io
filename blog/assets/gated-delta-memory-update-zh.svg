<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2780" viewBox="0 0 640 2780" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">门控记忆：写入与遗忘</title><desc id="desc">原创矩阵演算与机制示意，非训练效果或 GPU 性能数据。矩阵状态 S 的形状为值维度乘键维度；固定大小不代表无损保存任意历史。加法写入、定向 delta 纠正、全局遗忘后 delta 纠正是三种替代机制，不是串行操作。正确门控顺序是先把旧状态乘 α，再以衰减状态对单位 L2 键的读数计算 β 倍残差，最后沿该键写入；用更新后的状态读取查询，查询缩放已吸收。教学算例的状态为一乘二矩阵，旧状态 [1,2]，α=0.5、β=1、键 [1,0]、目标值 3：衰减状态 [0.5,1]，写入残差 2.5，新状态 [3,1]。若先按未衰减状态做 delta 更新得到 [3,2]，再整体衰减，则错误地得到 [1.5,1]。另一个教学端点算例使用 α=β=1、单位键 [1,1] 除以根号二、目标值 0，旧状态 [1,2] 变为 [−0.5,0.5]；对查询 [1,0] 的读数从 1 变为 −0.5，表明非正交地址可受写入干扰，并非语义检索证据。按用途分支：递归解码每步更新固定矩阵并读出；分块预填充求解严格下三角的残差依赖，然后进行带衰减且包含对角项的因果读出。混合架构的全注意力层仍保留随上下文增长的 KV。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}</style>
<rect width="640" height="2780" fill="#F7F8FA"/>
<text x="32" y="62" font-size="35" class="heading" text-anchor="start">门控记忆：写入与遗忘</text>
<text x="32" y="110" font-size="25" class="secondary" text-anchor="start">先整体遗忘，再按当前键修正</text>
<rect x="24" y="154" width="592" height="420" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="200" font-size="30" class="heading" text-anchor="middle">01 · 固定大小，不等于无损历史</text>
<rect x="48" y="226" width="544" height="66" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="268" font-size="29" class="heading accent" text-anchor="middle">状态 S：值维度 × 键维度</text>
<text x="320" y="333" font-size="25" class="secondary" text-anchor="middle">固定大小的状态不能无损保留任意历史</text>
<text x="320" y="377" font-size="27" class="heading" text-anchor="middle">三种替代机制，不是串行步骤</text>
<text x="320" y="423" font-size="27" class="secondary" text-anchor="middle">加法写入：累积关联</text>
<text x="320" y="466" font-size="27" class="secondary" text-anchor="middle">delta 写入：沿当前键纠正</text>
<text x="320" y="509" font-size="27" class="secondary" text-anchor="middle">门控 delta：整体遗忘后再纠正</text>
<rect x="24" y="602" width="592" height="804" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="648" font-size="30" class="heading" text-anchor="middle">02 · 顺序决定新写入能否保留</text>
<text x="320" y="691" font-size="28" class="secondary" text-anchor="middle">旧状态 [1, 2]（1 × 2 矩阵）</text>
<text x="320" y="731" font-size="28" class="secondary" text-anchor="middle">α = 0.5 · β = 1</text>
<text x="320" y="771" font-size="27" class="secondary" text-anchor="middle">单位键 k = [1, 0] · 目标值 v = 3</text>
<rect x="48" y="795" width="544" height="88" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="830" font-size="26" class="heading" text-anchor="middle">先整体衰减</text>
<text x="320" y="868" font-size="32" class="heading accent" text-anchor="middle">[0.5, 1]</text>
<path d="M320 891 V912" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="925" width="544" height="88" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="960" font-size="26" class="heading" text-anchor="middle">按衰减后的读数计算残差</text>
<text x="320" y="998" font-size="32" class="heading accent" text-anchor="middle">3 − 0.5 = 2.5</text>
<path d="M320 1021 V1042" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="1056" width="544" height="88" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1091" font-size="26" class="heading" text-anchor="middle">再沿当前键写入</text>
<text x="320" y="1129" font-size="32" class="heading accent" text-anchor="middle">新状态 [3, 1]</text>
<rect x="48" y="1182" width="544" height="166" rx="8" fill="#F7F8FA" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="1226" font-size="28" class="heading" text-anchor="middle">错误次序（对照）</text>
<text x="320" y="1264" font-size="27" class="secondary" text-anchor="middle">先做 delta，再整体衰减</text>
<text x="320" y="1310" font-size="32" class="heading" text-anchor="middle">[3, 2] → [1.5, 1]</text>
<text x="320" y="1376" font-size="25" class="muted" text-anchor="middle">β = 1 是教学端点</text>
<rect x="24" y="1434" width="592" height="540" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1479" font-size="29" class="heading" text-anchor="middle">03 · 非正交地址会相互干扰</text>
<text x="320" y="1524" font-size="28" class="secondary" text-anchor="middle">α = 1 · β = 1 · v = 0</text>
<text x="320" y="1566" font-size="28" class="secondary" text-anchor="middle">单位键 k = [1, 1] / √2</text>
<rect x="48" y="1600" width="544" height="96" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1640" font-size="27" class="secondary" text-anchor="middle">旧状态 → 新状态</text>
<text x="320" y="1680" font-size="32" class="heading accent" text-anchor="middle">[1, 2] → [−0.5, 0.5]</text>
<rect x="48" y="1730" width="544" height="100" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1772" font-size="28" class="heading" text-anchor="middle">对查询 e₁ = [1, 0] 的读出</text>
<text x="320" y="1816" font-size="36" class="heading accent" text-anchor="middle">1 → −0.5</text>
<text x="320" y="1876" font-size="25" class="secondary" text-anchor="middle">即使没有整体遗忘，其他地址仍可变化</text>
<text x="320" y="1916" font-size="25" class="secondary" text-anchor="middle">这是几何干扰，不是语义检索结论</text>
<text x="320" y="1951" font-size="24" class="muted" text-anchor="middle">α、β 均取教学端点</text>
<rect x="24" y="2002" width="592" height="662" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2047" font-size="30" class="heading" text-anchor="middle">04 · 两种用途，两种执行路径</text>
<text x="320" y="2090" font-size="26" class="secondary" text-anchor="middle">相同递推的不同执行方式</text>
<rect x="60" y="2118" width="532" height="148" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2160" font-size="29" class="heading" text-anchor="middle">逐 token 解码</text>
<text x="320" y="2203" font-size="27" class="secondary" text-anchor="middle">每一步更新固定大小的 S</text>
<text x="320" y="2243" font-size="27" class="secondary" text-anchor="middle">用更新后的 S 读取查询 q</text>
<rect x="60" y="2302" width="532" height="188" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2345" font-size="29" class="heading accent" text-anchor="middle">分块预填充</text>
<text x="320" y="2387" font-size="26" class="secondary" text-anchor="middle">求解严格下三角的残差依赖</text>
<text x="320" y="2426" font-size="27" class="secondary" text-anchor="middle">带衰减的因果读出</text>
<text x="320" y="2465" font-size="26" class="secondary" text-anchor="middle">读出包含当前位置的对角项</text>
<path d="M44 2105 V2192 H54" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M44 2192 V2396 H54" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="2530" width="544" height="100" rx="8" fill="#F7F8FA" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="2573" font-size="26" class="heading" text-anchor="middle">混合架构中的全注意力层仍有 KV</text>
<text x="320" y="2616" font-size="27" class="secondary" text-anchor="middle">其 KV 会随上下文长度增长</text>
<text x="320" y="2714" font-size="25" class="muted" text-anchor="middle">原创矩阵演算与机制示意</text>
<text x="320" y="2752" font-size="25" class="muted" text-anchor="middle">非训练效果 · 非 GPU 性能测量</text>
</svg>
