<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 640 1600" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">From low error to reliable molecular dynamics</title><desc id="desc">Original four-layer analytical framework, not measured data. Low static test error is insufficient to establish molecular-dynamics reliability. Check single-valued smooth energy, forces from the negative gradient of that same energy, and smooth bounded derivatives. Check graph construction for hard nearest-K neighbor replacement and smooth decay of edge messages at the distance cutoff. Sweep the integration time step and compare numerical precision and integration error. Separately inspect NVE drift of kinetic plus potential energy for numerical consistency, and physical accuracy against independent DFT or property references. Energy conservation alone does not establish physical accuracy. This is a checking framework, not a sufficient guarantee for every algorithm.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}</style>
<rect width="640" height="1600" fill="#F7F8FA"/>
<text x="32" y="48" font-size="34" class="heading" text-anchor="start">From low error to</text>
<text x="32" y="88" font-size="34" class="heading" text-anchor="start">reliable molecular dynamics</text>
<text x="32" y="130" font-size="26" class="secondary" text-anchor="start">Separate model, implementation and solver</text>
<rect x="40" y="162" width="560" height="92" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="199" font-size="30" class="heading" text-anchor="middle">Low static test error</text>
<text x="320" y="236" font-size="27" class="secondary" text-anchor="middle">does not establish MD reliability</text>
<path d="M320 260 V285" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="294" width="560" height="204" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="337" font-size="30" class="heading accent" text-anchor="middle">01  Potential model</text>
<text x="320" y="382" font-size="27" class="secondary" text-anchor="middle">Single-valued, smooth energy</text>
<text x="320" y="421" font-size="27" class="secondary" text-anchor="middle">Forces from its negative gradient</text>
<text x="320" y="460" font-size="27" class="secondary" text-anchor="middle">Check smooth, bounded derivatives</text>
<path d="M320 504 V529" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="538" width="560" height="204" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="581" font-size="30" class="heading accent" text-anchor="middle">02  Graph and cutoff</text>
<text x="320" y="626" font-size="27" class="secondary" text-anchor="middle">Avoid hard nearest-K</text>
<text x="320" y="665" font-size="27" class="secondary" text-anchor="middle">neighbor replacement</text>
<text x="320" y="704" font-size="27" class="secondary" text-anchor="middle">Edge messages decay smoothly at cutoff</text>
<path d="M320 748 V773" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="782" width="560" height="168" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="825" font-size="30" class="heading accent" text-anchor="middle">03  Integrator and precision</text>
<text x="320" y="870" font-size="27" class="secondary" text-anchor="middle">Sweep the integration time step</text>
<text x="320" y="909" font-size="27" class="secondary" text-anchor="middle">Compare precision and integration error</text>
<path d="M320 956 V981" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="990" width="560" height="402" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1036" font-size="30" class="heading accent" text-anchor="middle">04  Trajectory and properties</text>
<rect x="60" y="1064" width="520" height="152" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1106" font-size="29" class="heading" text-anchor="middle">NVE total-energy drift</text>
<text x="320" y="1145" font-size="27" class="secondary" text-anchor="middle">Check kinetic plus potential energy</text>
<text x="320" y="1184" font-size="27" class="secondary" text-anchor="middle">Test numerical consistency</text>
<rect x="60" y="1240" width="520" height="126" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1287" font-size="28" class="heading" text-anchor="middle">Independent DFT / properties</text>
<text x="320" y="1330" font-size="27" class="secondary" text-anchor="middle">Test physical accuracy separately</text>
<text x="320" y="1441" font-size="28" class="heading" text-anchor="middle">Conservation alone does not</text>
<text x="320" y="1478" font-size="28" class="heading" text-anchor="middle">establish physical accuracy</text>
<text x="320" y="1564" font-size="25" class="muted" text-anchor="middle">Original analysis · Not measured data</text>
</svg>
