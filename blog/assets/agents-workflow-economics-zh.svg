<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1200" viewBox="0 0 720 1200" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">智能体如何形成商业价值</title><desc id="desc">纵向四步：能力门槛、上下文与授权执行、结果验证与异常恢复、重复采用与付费。验证发现的失败反馈到执行流程。模型与工具、运行环境、人工复核与返工、集成与运维均计入成本。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 Z" fill="#607080"/></marker></defs>
<rect width="720" height="1200" rx="18" fill="#F7F8FA"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="42" y="49" font-size="34" fill="#182D49" font-weight="700" text-anchor="start">智能体如何形成商业价值</text>
<text x="42" y="91" font-size="28" fill="#526171" font-weight="400" text-anchor="start">能力是起点；可靠执行与验收</text>
<text x="42" y="125" font-size="28" fill="#526171" font-weight="400" text-anchor="start">才有机会带来持续使用和付费。</text>
<rect x="48" y="153" width="624" height="138" rx="13" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<rect x="48" y="153" width="7" height="138" rx="3" fill="#355C7D"/>
<text x="76" y="193" font-size="30" fill="#355C7D" font-weight="700" text-anchor="start">01  能力门槛</text>
<text x="76" y="232" font-size="28" fill="#526171" font-weight="400" text-anchor="start">理解任务与约束</text>
<text x="76" y="268" font-size="28" fill="#526171" font-weight="400" text-anchor="start">具备必要推理能力</text>
<path d="M 360 298 V 322" fill="none" stroke="#607080" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="329" width="624" height="138" rx="13" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<rect x="48" y="329" width="7" height="138" rx="3" fill="#355C7D"/>
<text x="76" y="369" font-size="30" fill="#355C7D" font-weight="700" text-anchor="start">02  上下文与授权执行</text>
<text x="76" y="408" font-size="28" fill="#526171" font-weight="400" text-anchor="start">取得正确数据和权限</text>
<text x="76" y="444" font-size="28" fill="#526171" font-weight="400" text-anchor="start">执行动作并保留状态</text>
<path d="M 360 474 V 498" fill="none" stroke="#607080" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="505" width="624" height="138" rx="13" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<rect x="48" y="505" width="7" height="138" rx="3" fill="#355C7D"/>
<text x="76" y="545" font-size="30" fill="#355C7D" font-weight="700" text-anchor="start">03  结果验证与异常恢复</text>
<text x="76" y="584" font-size="28" fill="#526171" font-weight="400" text-anchor="start">核对结果和证据</text>
<text x="76" y="620" font-size="28" fill="#526171" font-weight="400" text-anchor="start">发现失败并处理例外</text>
<path d="M 360 650 V 674" fill="none" stroke="#607080" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="681" width="624" height="138" rx="13" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<rect x="48" y="681" width="7" height="138" rx="3" fill="#355C7D"/>
<text x="76" y="721" font-size="30" fill="#355C7D" font-weight="700" text-anchor="start">04  重复采用与付费</text>
<text x="76" y="760" font-size="28" fill="#526171" font-weight="400" text-anchor="start">持续交付认可的结果</text>
<text x="76" y="796" font-size="28" fill="#526171" font-weight="400" text-anchor="start">观察续约与单位经济性</text>
<path d="M 43 574 H 18 V 398 H 43" fill="none" stroke="#607080" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="360" y="867" font-size="28" fill="#355C7D" font-weight="400" text-anchor="middle">失败反馈 → 更新测试与规则</text>
<text x="360" y="903" font-size="28" fill="#355C7D" font-weight="400" text-anchor="middle">再改进下一轮执行流程</text>
<rect x="42" y="935" width="636" height="170" rx="12" fill="#EDF2F6"/>
<text x="65" y="975" font-size="30" fill="#1F2933" font-weight="700" text-anchor="start">全部成本都要计入</text>
<text x="65" y="1015" font-size="28" fill="#1F2933" font-weight="400" text-anchor="start">模型与工具 · 运行环境</text>
<text x="65" y="1049" font-size="28" fill="#1F2933" font-weight="400" text-anchor="start">人工复核与返工 · 集成与运维</text>
<text x="42" y="1149" font-size="26" fill="#607080" font-weight="400" text-anchor="start">原创概念图：箭头不代表实测效果。</text>
<text x="42" y="1180" font-size="26" fill="#607080" font-weight="400" text-anchor="start">采用、收入与利润，需要分别验证。</text>
</g></svg>
