<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1740" viewBox="0 0 640 1740" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">MLA：缓存共享，计算逐头</title><desc id="desc">原创 MLA 机制示意。每个历史 token 只长期缓存 r 维联合潜变量 c_j 和 s 维共享位置 key k_j^R。逐头处理当前 query：用该头 key 上投影矩阵的转置变换内容 query，得到 r 维 query，并保留独立位置 query。潜空间内容打分与位置打分相加，保留原内容与位置维度决定的缩放，而非按潜变量维度重新缩放。每头分别 softmax，使用本头同一组注意力权重聚合缓存 c_j，得到本头 r 维 z_t,i，再通过本头 value 上投影和输出投影。不同 head 的权重与潜空间聚合分别计算，不把各头的 z 提前合并。不需要重建全部历史 key 或 value。本图非实测数据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}.symbol{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}</style>
<rect width="640" height="1740" fill="#F7F8FA"/>
<text x="32" y="49" font-size="34" class="heading" text-anchor="start">MLA：缓存共享，计算逐头</text>
<text x="32" y="86" font-size="26" class="secondary" text-anchor="start">在潜空间完成打分与 value 聚合</text>
<rect x="48" y="114" width="544" height="66" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="157" font-size="32" class="heading" text-anchor="middle">历史 token x_j</text>
<path d="M320 186 V211" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="218" width="560" height="216" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="258" font-size="30" class="heading accent" text-anchor="middle">长期缓存只有这两部分</text>
<rect x="56" y="280" width="252" height="136" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="182" y="317" font-size="32" class="heading symbol" text-anchor="middle">c_j</text>
<text x="182" y="355" font-size="28" class="" text-anchor="middle">共享 KV 潜变量</text>
<text x="182" y="395" font-size="26" class="secondary" text-anchor="middle">r 维</text>
<rect x="332" y="280" width="252" height="136" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="458" y="317" font-size="32" class="heading symbol" text-anchor="middle">k_j^R</text>
<text x="458" y="355" font-size="28" class="" text-anchor="middle">共享位置 key</text>
<text x="458" y="395" font-size="26" class="secondary" text-anchor="middle">s 维</text>
<path d="M50 349 H24 V1242 H41" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M606 326 H620 V907 H599" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="477" width="544" height="126" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="525" font-size="30" class="heading" text-anchor="middle">当前 head i 的 query</text>
<text x="320" y="575" font-size="28" class="" text-anchor="middle">内容 query 与位置 query</text>
<path d="M320 609 V629" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="636" width="544" height="148" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="675" font-size="30" class="heading" text-anchor="middle">内容 query 吸收 key 上投影</text>
<text x="320" y="721" font-size="26" class="" text-anchor="middle">用 key 上投影矩阵的转置变换</text>
<text x="320" y="765" font-size="26" class="secondary" text-anchor="middle">得到 r 维 query；位置 query 独立保留</text>
<path d="M320 790 V817" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="824" width="544" height="164" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="870" font-size="30" class="heading" text-anchor="middle">内容得分与位置得分合成 score</text>
<text x="320" y="923" font-size="26" class="secondary" text-anchor="middle">沿用原内容与位置维度的缩放</text>
<text x="320" y="965" font-size="26" class="secondary" text-anchor="middle">不改按潜变量维度缩放</text>
<path d="M320 994 V1019" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="1026" width="544" height="110" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1070" font-size="30" class="heading" text-anchor="middle">每个 head 单独做 softmax</text>
<text x="320" y="1112" font-size="28" class="" text-anchor="middle">得到本 head 的一组注意力权重</text>
<path d="M320 1142 V1167" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="1174" width="544" height="124" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1221" font-size="30" class="heading" text-anchor="middle">用同一组权重聚合 c_j</text>
<text x="320" y="1270" font-size="28" class="" text-anchor="middle">得到本 head 的 z_t,i：r 维</text>
<path d="M320 1304 V1329" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="1336" width="544" height="124" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1383" font-size="30" class="heading" text-anchor="middle">本 head 的 value 上投影</text>
<text x="320" y="1432" font-size="28" class="" text-anchor="middle">将 z_t,i 映射回 value 维度</text>
<path d="M320 1466 V1491" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="1498" width="544" height="72" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1545" font-size="32" class="heading" text-anchor="middle">输出投影</text>
<text x="320" y="1620" font-size="28" class="heading" text-anchor="middle">上投影前，不合并各 head 的 z</text>
<text x="320" y="1664" font-size="28" class="secondary" text-anchor="middle">无需还原全部历史 K / V</text>
<text x="320" y="1714" font-size="24" class="muted" text-anchor="middle">原创机制示意 · 非实测数据</text>
</svg>