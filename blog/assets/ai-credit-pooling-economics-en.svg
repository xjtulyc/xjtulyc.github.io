<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2530" viewBox="0 0 640 2530" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Pooled credits do not finish tasks</title><desc id="desc">Original conceptual mechanism, not measured outcomes. Seat fees provide a current-cycle service-use allowance that is reduced by actual metered use; it is not a bank balance. Under an assumed common cycle, common unit price, full pooling and no individual hard caps, A and B each receive 100 units. A uses 160 and B uses 40. Separate metering produces overage of 60 for A and zero for B, with 60 unused units at B. Under full pooling, both total use and total allowance are 200, so overage is zero. These are synthetic allowance units, not product prices or user data, and they do not represent any vendor’s actual pooling rules. Check contractual pool scope, cycle, expiry and overage; credit counts cannot be compared directly across vendors. Remaining credit, user limits, and applicable enabled stop rules gate execution or a pause and request for more budget. A budget alert does not automatically mean a hard stop. AI token usage and Runner/Actions resource usage from a workflow session are metered separately, then the work is accepted against task criteria. Pooling may reduce simultaneous unused allowance and overage, but it does not guarantee plan completion.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}</style>
