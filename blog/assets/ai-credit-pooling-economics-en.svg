<text x="320" y="1291" font-size="24" class="secondary" text-anchor="middle">Check pool scope, cycle, expiry and overage</text>
<text x="320" y="1331" font-size="24" class="heading accent" text-anchor="middle">Do not compare raw credits across vendors</text>
<rect x="24" y="1420" width="592" height="450" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1466" font-size="30" class="heading" text-anchor="middle">03 · Gate execution with explicit rules</text>
<rect x="60" y="1494" width="520" height="92" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1533" font-size="28" class="heading accent" text-anchor="middle">Remaining credit · User limits</text>
<text x="320" y="1571" font-size="27" class="secondary" text-anchor="middle">Applicable and enabled stop rules</text>
<path d="M320 1594 V1618 H180 V1637" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M320 1618 H460 V1637" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
