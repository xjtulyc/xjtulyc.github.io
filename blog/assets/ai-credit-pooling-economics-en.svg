<text x="180" y="1066" font-size="38" class="heading accent" text-anchor="middle">60</text>
<text x="460" y="1020" font-size="27" class="heading" text-anchor="middle">Pooled overage</text>
<text x="460" y="1066" font-size="38" class="heading accent" text-anchor="middle">0</text>
<text x="320" y="1133" font-size="27" class="secondary" text-anchor="middle">Separate: B leaves 60; A exceeds by 60</text>
<text x="320" y="1173" font-size="27" class="secondary" text-anchor="middle">Pooled: total use 200; total credit 200</text>
<rect x="48" y="1210" width="544" height="154" rx="8" fill="#F7F8FA" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
