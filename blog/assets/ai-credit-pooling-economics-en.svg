<text x="529" y="925" font-size="32" class="heading accent" text-anchor="middle">0</text>
<rect x="48" y="980" width="264" height="108" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<rect x="328" y="980" width="264" height="108" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
