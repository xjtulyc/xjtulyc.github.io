<text x="320" y="265" font-size="29" class="secondary" text-anchor="middle">Seat fees</text>
<path d="M320 292 V313" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="324" width="520" height="58" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="363" font-size="29" class="heading accent" text-anchor="middle">Allowance for the current cycle</text>
<path d="M320 390 V411" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="422" width="520" height="58" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="461" font-size="29" class="secondary" text-anchor="middle">Deduct measured service usage</text>
<text x="320" y="522" font-size="26" class="secondary" text-anchor="middle">Service-use allowance, not a bank balance</text>
<rect x="24" y="582" width="592" height="810" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="627" font-size="30" class="heading" text-anchor="middle">02 · Same use, different overage</text>
<text x="320" y="672" font-size="26" class="secondary" text-anchor="middle">Assume one cycle, one price, full pooling</text>
<text x="320" y="710" font-size="26" class="secondary" text-anchor="middle">No individual hard caps in this example</text>
<rect x="48" y="738" width="544" height="214" rx="8" fill="#F7F8FA" stroke="#D9E1E8" stroke-width="2"/>
<path d="M48 794 H592 M48 873 H592" fill="none" stroke="#D9E1E8" stroke-width="2"/>
<text x="106" y="776" font-size="27" class="heading" text-anchor="middle">User</text>
<text x="248" y="776" font-size="27" class="heading" text-anchor="middle">Credit</text>
<text x="390" y="776" font-size="27" class="heading" text-anchor="middle">Use</text>
<text x="529" y="776" font-size="27" class="heading" text-anchor="middle">Overage</text>
<text x="106" y="845" font-size="32" class="secondary" text-anchor="middle">A</text>
