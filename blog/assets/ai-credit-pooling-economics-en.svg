<text x="32" y="110" font-size="25" class="secondary" text-anchor="start">Reduce idle credit plus overage; verify outcomes</text>
<rect x="24" y="154" width="592" height="400" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="200" font-size="30" class="heading" text-anchor="middle">01 · From seat fees to service usage</text>
