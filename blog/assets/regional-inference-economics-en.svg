<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1830" viewBox="0 0 640 1830" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">The same model · Different regional boundaries</title><desc id="desc">Original analysis, not measured data. Access-endpoint location and data-at-rest location are distinct from the permitted scope of model inference. Neither entry nor storage in a region establishes that inference executes there. Hold the same model and existing node set fixed, and compare the Global permitted routes with a region-constrained set. The constraint can only retain or remove original routes; the two sets may be equal, so fewer routes are not guaranteed. The nested sets are conceptual, not machine counts or evidence of a strict reduction. Regional constraints may alter scheduling and available capacity, but do not alone establish the direction of latency or cost. Measure latency, capacity and operating cost on the actual workload, and record quoted token prices separately. Jointly accept features, inference execution location, tool and log boundaries, and service performance to evaluate a deliverable regional service. A region-expansion plan is not evidence that the relevant models and features are already available there. Exact scope depends on the supported product.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}</style>
