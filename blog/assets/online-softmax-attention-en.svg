<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1960" viewBox="0 0 640 1960" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Tiled computation · A shared row-wise softmax</title><desc id="desc">Original forward-pass mechanism, not performance data. Partition one query row’s valid keys into two disjoint blocks. Each block retains its maximum score m, the exponential weight sum l relative to that maximum, and the value-vector sum u weighted by the same unnormalized weights. Blocks A and B have separate states. To merge, take the larger block maximum as the shared new maximum and compute an exponential scale from each old-to-new maximum difference. Apply the same scale to a block’s l and u, sum the scaled normalizers and weighted value sums separately, then divide merged u by merged l. Do not directly add independently normalized block outputs. Skip a block with no valid keys; an entirely empty row needs an explicit implementation policy. Complete attention still evaluates every valid query-key pair. Tiling avoids HBM reads and writes of the full quadratic score or probability intermediate, rather than reducing the number of valid pairs in dense attention.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}.state{font-family:Consolas,Menlo,monospace;fill:#355C7D}</style>
<rect width="640" height="1960" fill="#F7F8FA"/>
<text x="32" y="48" font-size="34" class="heading" text-anchor="start">Tiled computation</text>
<text x="32" y="88" font-size="34" class="heading" text-anchor="start">A shared row-wise softmax</text>
<text x="32" y="132" font-size="25" class="secondary" text-anchor="start">One query row, valid keys in two disjoint blocks</text>
<rect x="40" y="166" width="560" height="156" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="212" font-size="30" class="heading" text-anchor="middle">Keep three values per block</text>
<text x="320" y="258" font-size="26" class="secondary" text-anchor="middle">Maximum m · Shifted exponential sum l</text>
<text x="320" y="300" font-size="26" class="secondary" text-anchor="middle">Unnormalized weighted value-vector sum u</text>
<path d="M320 330 V357 H28 V568" fill="none" stroke="#355C7D" stroke-width="2.5"/>
<rect x="68" y="390" width="508" height="110" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="434" font-size="29" class="heading" text-anchor="middle">Block A state</text>
<text x="320" y="477" font-size="29" class="state" text-anchor="middle">m_A · l_A · u_A</text>
<rect x="68" y="536" width="508" height="110" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="580" font-size="29" class="heading" text-anchor="middle">Block B state</text>
<text x="320" y="623" font-size="29" class="state" text-anchor="middle">m_B · l_B · u_B</text>
<path d="M28 446 H59" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M28 568 H59" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M584 446 H612 V692 H320 V721" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M584 591 H612" fill="none" stroke="#355C7D" stroke-width="2.5"/>
<rect x="40" y="732" width="560" height="122" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="777" font-size="28" class="heading accent" text-anchor="middle">Choose a shared new maximum m</text>
<text x="320" y="820" font-size="27" class="secondary" text-anchor="middle">The larger of the two block maxima</text>
<path d="M320 862 V890" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="902" width="560" height="206" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="948" font-size="30" class="heading accent" text-anchor="middle">Rescale, then merge each sum</text>
<text x="320" y="991" font-size="26" class="secondary" text-anchor="middle">Exponentiate old maximum minus new</text>
<text x="320" y="1033" font-size="26" class="secondary" text-anchor="middle">Use one block scale for both l and u</text>
<text x="320" y="1076" font-size="26" class="secondary" text-anchor="middle">Add rescaled l and u sums separately</text>
<path d="M320 1116 V1144" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="1156" width="560" height="118" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1200" font-size="30" class="heading" text-anchor="middle">Normalize only at the end</text>
<text x="320" y="1244" font-size="26" class="secondary" text-anchor="middle">Divide merged u by merged l for the output</text>
<rect x="40" y="1316" width="560" height="108" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="1360" font-size="29" class="heading" text-anchor="middle">Do not directly add</text>
<text x="320" y="1402" font-size="26" class="secondary" text-anchor="middle">the independently normalized block outputs</text>
<rect x="40" y="1462" width="560" height="150" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="320" y="1506" font-size="29" class="heading" text-anchor="middle">Handle empty states explicitly</text>
<text x="320" y="1549" font-size="27" class="secondary" text-anchor="middle">No valid keys in a block: skip it</text>
<text x="320" y="1590" font-size="26" class="secondary" text-anchor="middle">No valid keys in the row: define a policy</text>
<rect x="40" y="1652" width="560" height="210" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1697" font-size="30" class="heading accent" text-anchor="middle">Reduce data movement</text>
<text x="320" y="1740" font-size="26" class="secondary" text-anchor="middle">All valid query-key pairs are still evaluated</text>
<text x="320" y="1783" font-size="26" class="secondary" text-anchor="middle">Avoid full quadratic intermediates in HBM</text>
<text x="320" y="1825" font-size="26" class="secondary" text-anchor="middle">Dense attention does not use fewer pairs</text>
<text x="320" y="1906" font-size="24" class="muted" text-anchor="middle">One-row, two-block forward-pass mechanism</text>
<text x="320" y="1942" font-size="25" class="muted" text-anchor="middle">Original illustration · Not performance data</text>
</svg>
