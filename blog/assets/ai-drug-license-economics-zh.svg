<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2550" viewBox="0 0 640 2550" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">AI 药物许可：证据与权利</title><desc id="desc">原创交易机制示意，非实验或交易效果数据。软件使用权、约定的研究交付、药物资产权利与证据包是三种并列的合同对象，不是必然升级的顺序。图中只展开药物资产许可：证据和知识产权尽调核对证据、权属与许可权限；合同定义许可范围、地域与双方义务；买方按合同分工进行下游开发、制造和商业化。三类付款分别审视：首付款需核对支付条件与实际到账；开发、注册和商业里程碑取决于约定触发条件；销售提成取决于约定的销售口径与条款。标题总额不能直接视为现金到账或当期收入。签约、交接与履约、会计收入确认是不同判断，现金和收入的时点分别核对。技术效率可能增加资产选择，价值兑现仍依赖证据、权利与下游进展；更快发现不意味着临床成功。箭头表示信息与合同分析流程，不是任何公司的实测结果或必然商业结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#355C7D" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1F2933}.heading{font-weight:700}.accent{fill:#355C7D}.secondary{fill:#526171}.muted{fill:#607080}</style>
<rect width="640" height="2550" fill="#F7F8FA"/>
<text x="32" y="65" font-size="35" class="heading" text-anchor="start">AI 药物许可：证据与权利</text>
<text x="32" y="110" font-size="25" class="secondary" text-anchor="start">价值兑现还要经过合同与下游开发</text>
<rect x="24" y="154" width="592" height="358" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="198" font-size="29" class="heading" text-anchor="middle">01 · 三类交易对象，彼此并列</text>
<rect x="48" y="221" width="544" height="58" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="260" font-size="28" class="heading" text-anchor="middle">软件使用权</text>
<rect x="48" y="296" width="544" height="58" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="335" font-size="28" class="heading" text-anchor="middle">约定的研究交付</text>
<rect x="48" y="371" width="544" height="58" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="410" font-size="28" class="heading accent" text-anchor="middle">药物资产权利与证据包</text>
<text x="320" y="465" font-size="25" class="secondary" text-anchor="middle">不同的合同对象</text>
<text x="320" y="496" font-size="24" class="muted" text-anchor="middle">不是软件必然升级为药物资产</text>
<rect x="24" y="540" width="592" height="528" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="588" font-size="29" class="heading" text-anchor="middle">02 · 展开药物资产许可这一类</text>
<rect x="48" y="614" width="544" height="100" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="654" font-size="28" class="heading" text-anchor="middle">证据与知识产权尽调</text>
<text x="320" y="693" font-size="25" class="secondary" text-anchor="middle">核对证据、权属与许可权限</text>
<path d="M320 721 V746" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="757" width="544" height="100" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="797" font-size="28" class="heading accent" text-anchor="middle">明确定义许可权利</text>
<text x="320" y="836" font-size="25" class="secondary" text-anchor="middle">范围、地域及双方义务</text>
<path d="M320 864 V889" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="900" width="544" height="136" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="940" font-size="28" class="heading" text-anchor="middle">买方的下游执行</text>
<text x="320" y="979" font-size="25" class="secondary" text-anchor="middle">开发 · 制造 · 商业化</text>
<text x="320" y="1016" font-size="25" class="secondary" text-anchor="middle">责任分工以合同为准</text>
<rect x="24" y="1096" width="592" height="590" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1142" font-size="29" class="heading" text-anchor="middle">03 · 分开看三类付款</text>
<rect x="48" y="1171" width="544" height="108" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1213" font-size="29" class="heading" text-anchor="middle">首付款</text>
<text x="320" y="1254" font-size="25" class="secondary" text-anchor="middle">核对支付条件与实际到账</text>
<rect x="48" y="1298" width="544" height="144" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1340" font-size="29" class="heading" text-anchor="middle">附条件的里程碑付款</text>
<text x="320" y="1381" font-size="25" class="secondary" text-anchor="middle">开发 · 注册 · 商业</text>
<text x="320" y="1418" font-size="25" class="secondary" text-anchor="middle">约定的触发条件满足后才支付</text>
<rect x="48" y="1461" width="544" height="108" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1503" font-size="29" class="heading" text-anchor="middle">销售提成</text>
<text x="320" y="1544" font-size="25" class="secondary" text-anchor="middle">按约定销售口径与条款</text>
<text x="320" y="1614" font-size="27" class="heading accent" text-anchor="middle">不能把标题总额直接视为</text>
<text x="320" y="1656" font-size="27" class="heading accent" text-anchor="middle">现金到账或当期收入</text>
<rect x="24" y="1714" width="592" height="490" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1759" font-size="28" class="heading" text-anchor="middle">04 · 收入确认另看履约条件</text>
<rect x="48" y="1784" width="544" height="94" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1821" font-size="28" class="heading" text-anchor="middle">签订合同</text>
<text x="320" y="1858" font-size="25" class="secondary" text-anchor="middle">界定双方权利与义务</text>
<path d="M320 1882 V1898" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="1906" width="544" height="94" rx="8" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="1943" font-size="28" class="heading" text-anchor="middle">交接与履约</text>
<text x="320" y="1980" font-size="25" class="secondary" text-anchor="middle">核对承诺的内容何时被履行</text>
<path d="M320 2004 V2020" fill="none" stroke="#355C7D" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="2028" width="544" height="94" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2065" font-size="28" class="heading accent" text-anchor="middle">会计收入确认</text>
<text x="320" y="2102" font-size="25" class="secondary" text-anchor="middle">按适用准则评估履约与确认时点</text>
<text x="320" y="2168" font-size="25" class="muted" text-anchor="middle">现金时点与收入时点分别核对</text>
<rect x="24" y="2232" width="592" height="208" rx="8" fill="#EDF2F6" stroke="#D9E1E8" stroke-width="2"/>
<text x="320" y="2277" font-size="26" class="heading" text-anchor="middle">技术效率可增加资产选择</text>
<text x="320" y="2328" font-size="26" class="secondary" text-anchor="middle">兑现价值仍需证据、权利与下游进展</text>
<text x="320" y="2379" font-size="26" class="secondary" text-anchor="middle">发现更快，不等于临床成功</text>
<text x="320" y="2485" font-size="24" class="muted" text-anchor="middle">原创分析示意 · 非实验或效果数据</text>
<text x="320" y="2522" font-size="24" class="muted" text-anchor="middle">不表示任何公司的已实现交易结果</text>
</svg>
